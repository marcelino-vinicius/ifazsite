<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Capa</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;

            box-sizing: border-box;
        }

        body {
            height: 100vh;

            background: linear-gradient(#f91206,
                    #ae0d04 60%,
                    #630703);

            color: #f2f2f2;
            font-family: "Open Sans", sans-serif;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;
        }

        .logo {
            height: 250px;

            /* Ative isso se a logo for redonda */
            /* border-radius: 100%; */

            /* Ative isso para adicionar uma borda padrão */
            /* border: 3px solid white; */

            filter: drop-shadow(0 10px 5px hsla(0, 0%, 0%, 0.3));
        }

        h1 {
            margin-top: 20px;

            font-size: 3rem;
        }

        p {
            font-size: 1.75rem;
        }
    </style>
</head>

<body>
    <!-- COMO CRIAR AS CAPAS:
    1) Preencha as informações abaixo

    2) Ative as propriedades necessárias no CSS

    3) Abra esse arquivo no navegador

    4) Tire print com a tecla PrintScreen ou o atalho "Win + Shift + S"

    5) Cole a imagem na pasta de imagens do site
       OBS: Não confunda com a pasta "criar-capas/imagens" -->

    <img src="./imagens/logo_do_site.png" alt="Logo do site" class="logo">

    <h1>(Nome do site aqui)</h1>

    <p>[Descrição do site aqui]</p>
</body>

</html>
